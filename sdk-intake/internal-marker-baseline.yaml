# Ratchet baseline for vendor `#### INTERNAL ####` marker lines.
#
# Generated by `python sdk-intake/internal_markers.py update-baseline`.
# Each `files` entry records how many marker lines a historical vendor drop
# is still allowed to carry. The intake gate and tests/test_internal_markers.py
# fail when a file exceeds its entry, or carries markers with no entry --
# so a freshly regenerated payload can never add new internal content.
# Counts may only ever go down: scrub the tree, then regenerate.
#
# This file is review-gated, not tool-gated: `update-baseline` is deliberately
# self-service, because the control is the diff. Raising a count here is a
# visible, reviewable line in a pull request; the gate exists so that raising
# it is the *only* way new internal content can land.
#
# `unparseable_fences` records files whose fences the block parser refuses
# (orphan/nested BEGIN or END, a marker on a line of live code, a non-UTF-8
# payload). Counting marker lines cannot see an orphan fence -- deleting half
# a pair makes the count go *down* -- so these are ratcheted separately.
