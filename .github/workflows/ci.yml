name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the release-provenance tests verify their claims
          # against git (which commit last changed each promoted archive, and
          # the numstat of the recorded INTERNAL-marker sanitation). Both skip
          # themselves on a shallow clone, so the default fetch-depth of 1 let
          # them pass without ever running.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group ci

      - name: Run pre-commit checks
        run: uv run --group ci pre-commit run --all-files

      - name: Run tests
        run: |
          uv run --group ci python -m py_compile sdk-intake/build_ambiqsuite.py sdk-intake/intake_workflow.py
          uv run --group ci python -m pytest
