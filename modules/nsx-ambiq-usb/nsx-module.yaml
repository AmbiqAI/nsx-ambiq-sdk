schema_version: 1

module:
  name: nsx-ambiq-usb
  type: backend_specific
  category: sdk_component
  version: "5.2.24"

support:
  ambiqsuite: true
  zephyr: false

summary: Unified AmbiqSuite USB substrate (TinyUSB) for Apollo4P and Apollo5 SoCs.

capabilities:
  - usb_device
  - ambiq_usb
  - tinyusb_substrate
  - sdk_component

use_cases:
  - provide the Ambiq TinyUSB device-controller port for supported targets
  - expose SDK-vendored TinyUSB sources to higher-level USB modules
  - support bare-metal or framework-selected USB service loops

agent_keywords:
  - usb
  - tinyusb
  - ambiq
  - dcd
  - apollo4p
  - apollo5

build:
  cmake:
    package: nsx_ambiq_usb
    targets:
      - nsx::ambiq_usb

requires_app_contract:
  - USB descriptors and enabled TinyUSB classes are application or wrapper policy.
  - CDC buffer hook symbols are provided by the consuming wrapper or application.
  - The service model is selected by the wrapper or application; bare-metal polling is not forced here.

depends:
  required:
    - nsx-ambiqsuite
    - nsx-ambiq-hal
    - nsx-ambiq-bsp
  optional: []

compatibility:
  boards:
    - apollo4p_evb
    - apollo4p_blue_kbr_evb
    - apollo4p_blue_kxr_evb
    - apollo330mP_evb
    - apollo510_evb
    - apollo510b_evb
    - apollo510dL_evb
  socs:
    - apollo4p
    - apollo330P
    - apollo510
    - apollo510b
    - apollo510L
  toolchains:
    - arm-none-eabi-gcc
    - atfe
    - armclang
