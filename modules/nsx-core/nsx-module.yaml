schema_version: 1
module:
  name: nsx-core
  type: runtime
  version: "5.2.32"
licenses:
  .: BSD-3-Clause
  src/apollo2/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD
  src/apollo3/armclang/linker_script.sct: LicenseRef-AmbiqSuite-BSD
  src/apollo3/armclang/startup_keil6.c: LicenseRef-AmbiqSuite-BSD
  src/apollo3/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD
  src/apollo330P/armclang/startup_keil6.c: LicenseRef-AmbiqSuite-BSD
  src/apollo330P/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD
  src/apollo3p/armclang/startup_keil6.c: LicenseRef-AmbiqSuite-BSD
  src/apollo3p/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD
  src/apollo4l/armclang/startup_keil6.c: LicenseRef-AmbiqSuite-BSD
  src/apollo4l/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD
  src/apollo4p/armclang/startup_keil6.c: LicenseRef-AmbiqSuite-BSD
  src/apollo4p/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD
  src/apollo510/armclang/startup_keil6.c: LicenseRef-AmbiqSuite-BSD
  src/apollo510/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD
  src/apollo510L/armclang/startup_keil6.c: LicenseRef-AmbiqSuite-BSD
  src/apollo510L/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD
  src/apollo510b/armclang/startup_keil6.c: LicenseRef-AmbiqSuite-BSD
  src/apollo510b/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD
  src/apollo5b/armclang/startup_keil6.c: LicenseRef-AmbiqSuite-BSD
  src/apollo5b/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD
  src/atomiq110/armclang/startup_keil6.c: LicenseRef-AmbiqSuite-BSD
  src/atomiq110/gcc/startup_gcc.c: LicenseRef-AmbiqSuite-BSD

support:
  ambiqsuite: true
  zephyr: false
summary: Core runtime initialization, universal helpers, and byte ring-buffer support.
capabilities:
  - runtime
  - startup
  - application_lifecycle
  - debug_output
  - delay
  - interrupt_control
  - ring_buffer
use_cases:
  - baseline app bring-up
  - reusable runtime foundation
  - printf, low-power debug output, delay, and interrupt helpers
  - byte ring-buffer support
  - most NSX applications
agent_keywords:
  - core
  - runtime
  - app foundation
  - ring buffer
build:
  cmake:
    package: nsx_core
    targets:
      - nsx::core
      - nsx::runtime_core
      - nsx::compiler
      - nsx::util
      - nsx::mem
      - nsx::core_lifecycle
      - nsx::runtime
      - nsx::system
depends:
  required:
    - nsx-soc-hal
  optional: []
compatibility:
  boards:
    - '*'
  socs:
    - apollo330P
    - apollo510
    - apollo510b
    - apollo510L
    - atomiq110
    - apollo4l
    - apollo4p
    - apollo3
    - apollo3p
    - apollo2
  toolchains:
    - arm-none-eabi-gcc
    - atfe
    - armclang
