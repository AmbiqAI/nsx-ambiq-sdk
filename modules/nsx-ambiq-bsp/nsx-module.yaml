schema_version: 1

module:
  name: nsx-ambiq-bsp
  type: backend_specific
  category: sdk_component
  version: "0.1.0"

support:
  ambiqsuite: true
  zephyr: false

summary: Curated BSP wrapper surface for board-support integration on AmbiqSuite targets (all SoCs).

capabilities:
  - bsp_wrapper
  - board_support
  - sdk_component

use_cases:
  - board-support integration for any AmbiqSuite target
  - stable BSP access without wiring raw SDK board files by hand
  - dependency for board-oriented application bring-up

agent_keywords:
  - bsp
  - board support
  - ambiqsuite
  - wrapper

build:
  cmake:
    package: nsx_ambiq_bsp
    targets:
      - nsx::ambiq_bsp

depends:
  required:
    - nsx-ambiqsuite
    - nsx-ambiq-hal
  optional: []

compatibility:
  boards:
    - apollo2_evb
    - apollo3_evb
    - apollo3_evb_cygnus
    - apollo3p_evb
    - apollo3p_evb_cygnus
    - apollo4l_evb
    - apollo4l_blue_evb
    - apollo4p_evb
    - apollo4p_blue_kbr_evb
    - apollo4p_blue_kxr_evb
    - apollo330mP_evb
    - apollo510_evb
    - apollo5b_evb
    - apollo510b_evb
    - apollo510dL_evb
  socs:
    - apollo2
    - apollo3
    - apollo3p
    - apollo4l
    - apollo4p
    - apollo330P
    - apollo510
    - apollo5b
    - apollo510b
    - apollo510L
  toolchains:
    - arm-none-eabi-gcc
    - atfe
    - armclang
