schema_version: 1

module:
  name: nsx-ambiqsuite
  type: sdk_provider
  category: sdk_provider
  provider: ambiqsuite
  version: "5.2.24"
  sdk_release: "stable-2026.08.30"
  upstream_revision: "78bb76821ecb52c9bbbf5867b104ea95780dd916"

support:
  ambiqsuite: true
  zephyr: false

summary: Unified AmbiqSuite SDK provider covering all staged Apollo NSX targets.

capabilities:
  - sdk_provider
  - ambiqsuite

use_cases:
  - choose the AmbiqSuite SDK baseline for any Apollo-generation app
  - provide upstream SDK content for platform stacks
  - foundation for the Ambiq HAL and BSP layers

agent_keywords:
  - ambiqsuite
  - sdk
  - provider

build:
  cmake:
    package: nsx_sdk_ambiqsuite
    targets:
      - nsx::sdk_ambiqsuite

depends:
  required: []
  optional: []

compatibility:
  boards:
    - apollo2_evb
    - apollo3_evb
    - apollo3_evb_cygnus
    - apollo3p_evb
    - apollo3p_evb_cygnus
    - apollo4l_evb
    - apollo4l_blue_evb
    - apollo4p_evb
    - apollo4p_blue_kbr_evb
    - apollo4p_blue_kxr_evb
    - apollo4p_evb_disp_shield_rev2
    - apollo330mP_evb
    - apollo510_evb
    - apollo510b_evb
    - apollo510dL_evb
    - atomiq110_fpga_turbo
  socs:
    - apollo2
    - apollo3
    - apollo3p
    - apollo4l
    - apollo4p
    - apollo330P
    - apollo510
    - apollo510b
    - apollo510L
    - atomiq110
  toolchains:
    - arm-none-eabi-gcc
    - atfe
    - armclang
