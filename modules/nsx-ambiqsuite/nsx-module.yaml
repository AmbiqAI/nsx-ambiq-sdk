schema_version: 1

module:
  name: nsx-ambiqsuite
  type: sdk_provider
  category: sdk_provider
  provider: ambiqsuite
  version: "5.2.30"
  sdk_release: "stable-2026.11.05-sbrk42"
  upstream_revision: "83bd69c37edf8d94cf77021140d707c3fe886242"

support:
  ambiqsuite: true
  zephyr: false

summary: Unified AmbiqSuite SDK provider covering all staged Apollo NSX targets.

capabilities:
  - sdk_provider
  - ambiqsuite

use_cases:
  - choose the AmbiqSuite SDK baseline for any Apollo-generation app
  - provide upstream SDK content for platform stacks
  - foundation for the Ambiq HAL and BSP layers

agent_keywords:
  - ambiqsuite
  - sdk
  - provider

build:
  cmake:
    package: nsx_sdk_ambiqsuite
    targets:
      - nsx::sdk_ambiqsuite

depends:
  required: []
  optional: []

compatibility:
  boards:
    - "*"
  socs:
    - apollo2
    - apollo3
    - apollo3p
    - apollo4l
    - apollo4p
    - apollo330P
    - apollo510
    - apollo510b
    - apollo510L
    - atomiq110
  toolchains:
    - arm-none-eabi-gcc
    - atfe
    - armclang
