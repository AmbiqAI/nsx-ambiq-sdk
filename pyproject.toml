[project]
name = "nsx-ambiq-sdk"
version = "5.2.27"
description = "Unified Ambiq SDK package for NSX"
requires-python = ">=3.10"

[dependency-groups]
ci = [
    "pytest>=8",
    "PyYAML>=6",
    "pre-commit>=3.7",
    "tomli>=2; python_version < '3.11'",
]

hardware = ["pytest>=8", "pylink-square>=1.2,<3", "pyserial>=3.5,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

markers = ["hardware: opt-in physical board qualification", "smoke: minimal boot/runtime checks"]
