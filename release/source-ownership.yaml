schema_version: 1
precedence: most_specific_path_first

entries:
  - id: generated-ambiqsuite-provider
    classification: upstream-derived-generated
    paths:
      - modules/nsx-ambiqsuite/sdk
    generated: true
    direct_edit: forbidden
    update_mechanism: sdk-intake/build_ambiqsuite.py
    provenance: modules/nsx-ambiqsuite/sdk/artifact-manifest.yaml
    recorded_exceptions:
      - id: atomiq110-internal-marker-sanitation
        issue: 52
        date: 2026-08-21
        scope: modules/nsx-ambiqsuite/sdk/mcu/atomiq110
        summary: >-
          One-time, deletion-only sanitation of vendor `#### INTERNAL ####`
          engineering content from the atomiq110 headers. This tree is
          `direct_edit: forbidden`; the change is recorded here as a scoped,
          reviewed exception rather than treated as an ordinary edit, because
          the `npu-drop-2026.07.09` payload was a raw engineering drop that
          upstream's own release tooling had not stripped.
        mechanism: sdk-intake/internal_markers.py
        properties:
          - >-
            Tool-reproducible, not hand-edited. Running
            "sdk-intake/internal_markers.py scrub --root
            modules/nsx-ambiqsuite/sdk/mcu/atomiq110 --write" over the
            pre-scrub tree yields the committed tree byte-for-byte, and
            re-running it over the committed tree is a no-op.
          - >-
            Deletion-only at preprocessor-token level. 988 lines removed across
            23 files, 0 lines added or modified. Only marker lines of blocks
            removed entirely, bodies with no live tokens, "#if 0 ... #endif"
            regions inside a fence, and blank lines at a deletion seam were
            deleted. Any block still holding a live declaration kept its body
            and its fence verbatim, so no symbol visible to the compiler that
            built the prebuilt archives was touched.
          - >-
            Provenance strings, artifact manifests, and prebuilt archives are
            unaffected; no artifact hash changes.
        future_payloads: >-
          Gated at staging. `stage` runs
          `assert_no_new_internal_markers` against
          `sdk-intake/internal-marker-baseline.yaml`, so a regenerated drop is
          sanitized while staged and never needs a post-hoc edit to a promoted
          tree. This exception is not a precedent for editing the provider tree
          in place.
      - id: clang-cxx-header-compat
        issue: 81
        date: 2026-10-17
        scope: modules/nsx-ambiqsuite/sdk
        summary: >-
          Intake patches 001 and 002 applied directly to the committed provider
          headers and sources so that C++ translation units build with clang
          (ATfE). The committed
          payload cannot be reproduced from a single AmbiqSuite commit (see
          issue 82), so the patches could not be applied by re-staging.
        mechanism: sdk-intake/patches/stable
        properties:
          - >-
            Tool-reproducible, not hand-edited. Applying
            "sdk-intake/patches/stable/001-clang-cxx-compiler-detection.patch"
            and "002-clang-cxx-unnamed-bitfield-qualifiers.patch" to the
            previous payload with "git apply --directory=modules/nsx-ambiqsuite/sdk"
            yields the committed tree byte-for-byte.
          - >-
            26 files, 40 lines: 23 headers and 3 C sources
            (devices/am_devices_mspi_psram_{aps12804o,aps25616n,aps25616ba_1p2v}.c,
            which no NSX module compiles). Compiler detection tests __GNUC__
            instead of __GNUC_STDC_INLINE__, two debug macros gain the space
            C++11 needs before a string paste, and unnamed padding bit-fields in
            four USB register headers drop their qualifier. Every configuration
            that compiled before selects the same code, and register struct
            layout is unchanged.
          - >-
            Provenance strings, artifact manifests, and prebuilt archives are
            unaffected; no artifact hash changes.
        future_payloads: >-
          The patches stay in the intake hook, so `stage` re-applies them, and
          tests/test_committed_intake_patches.py fails if a promoted payload no
          longer carries them (build_ambiqsuite.py --promote does not run the
          hook). Retire both patches and this exception once AmbiqSuite carries
          the fix (issue 82).

  - id: upstream-ambiq-usb-copy
    classification: upstream-derived-auxiliary
    paths:
      - modules/nsx-ambiq-usb/sdk
    generated: false
    direct_edit: restricted
    update_expectation: Refresh from the approved upstream source; isolate and review any NSX patch.

  - id: upstream-psram-device-drivers
    classification: upstream-derived-auxiliary
    paths:
      - modules/nsx-psram/src/apollo3/devices
      - modules/nsx-psram/src/apollo4/devices
      - modules/nsx-psram/src/apollo5/devices
    generated: false
    direct_edit: restricted
    update_expectation: Preserve upstream notices and make NSX patches explicit and reviewable.

  - id: upstream-third-party-copies
    classification: upstream-or-third-party
    path_patterns:
      - modules/*/sdk/third_party/**
    generated: false
    direct_edit: restricted
    update_expectation: Follow the pinned version record and upstream license for each copy.

  - id: nsx-module-integration
    classification: nsx-owned
    path_patterns:
      - modules/*/CMakeLists.txt
      - modules/*/nsx-module.yaml
      - modules/*/includes-api/**
      - modules/*/src/**
    exclusions:
      - modules/*/sdk/**
      - modules/nsx-psram/src/*/devices/**
    generated: false
    direct_edit: allowed

  - id: nsx-soc-descriptors
    classification: nsx-owned
    paths:
      - cmake/socs
    generated: false
    direct_edit: allowed

  - id: nsx-board-descriptors
    classification: nsx-owned
    paths:
      - boards
    generated: false
    direct_edit: allowed
