  changes:
  - id: clang-cxx-header-compat
    refs:
    - PR 83
    - issue 81
    - issue 82
    summary: 'C++ translation units that include the AmbiqSuite HAL now compile with ATfE clang++. Intake
      patches 001 and 002 change 26 provider files, 40 lines: 23 headers and 3 C sources (devices/am_devices_mspi_psram_{aps12804o,aps25616n,aps25616ba_1p2v}.c).
      GNU-path detection tests __GNUC__ instead of __GNUC_STDC_INLINE__, two debug macros gain the space
      C++11 needs before a string paste, and unnamed padding bit-fields in four USB register headers drop
      their qualifier. Applies to every part. The three patched .c files are not compiled by any NSX module
      (nsx-psram builds its own copies under src/apollo*/devices/).'
    paths:
    - sdk-intake/patches/README.md
    - sdk-intake/patches/stable/001-clang-cxx-compiler-detection.patch
    - sdk-intake/patches/stable/001-clang-cxx-compiler-detection.yaml
    - sdk-intake/patches/stable/002-clang-cxx-unnamed-bitfield-qualifiers.patch
    - sdk-intake/patches/stable/002-clang-cxx-unnamed-bitfield-qualifiers.yaml
    - modules/nsx-ambiqsuite/sdk/devices/am_devices_emmc_rpmb.h
    - modules/nsx-ambiqsuite/sdk/devices/am_devices_mspi_psram_aps12804o.c
