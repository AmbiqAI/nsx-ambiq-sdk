  - id: nsx-psram-apollo510dl-compatibility
    refs:
    - PR 77
    - issue 76
    summary: 'nsx-psram lists apollo510dL_evb and apollo510L as compatible, so lock resolution no longer
      rejects it there. The driver is not defaulted for that board: NSX_PSRAM_USE_BA_DRIVER must be set
      explicitly. The rev 2 EVB does not populate its PSRAM footprint, and no hardware validation exists.'
    paths:
    - modules/nsx-psram/nsx-module.yaml
    - modules/nsx-psram/CMakeLists.txt
  - id: nsx-core-apollo2-3-heap-symbols
    refs:
    - PR 86
    - issue 85
    - issue 87
    summary: 'The apollo2, apollo3 and apollo3p GCC linker scripts in nsx-core now define __HeapBase and
      __HeapLimit (a .heap section after .bss running to the top of RWMEM, with the 1 KiB guard ASSERT),
      which nsx-core''s force-linked _sbrk needs. Before this, every GCC or ATfE application linking nsx::system
      for apollo3 and apollo3p boards failed to link, already on v5.2.24; such apps now link for the first
      time. PR #86 verified ble_webble on the Apollo3 Blue Plus EVB with arm-none-eabi-gcc 15.2.1 and
      ATfE 22.1.0 (flashed; 12 s of SWO showed BLE bring-up stages 6 through 37 and no failure line).
      apollo2 gets the same symbols but still does not build, for an unrelated reason; apollo3 (non-Plus)
      hardware was not tested; armclang uses scatter files and is unaffected. Known open issue #87: C++
      global constructors never run on apollo2/apollo3/apollo3p, because their startup files never call
      __libc_init_array and their linker scripts define no .init_array section or bounds (see known deviation
      apollo2-3-cxx-global-constructors). sbrk.c and nsx_system.h only update comments; tests/test_cmake_contract.py
      requires every nsx-core GCC linker script to define both symbols.'
    paths:
    - modules/nsx-core/src/apollo2/gcc/linker_script.ld
    - modules/nsx-core/src/apollo3/gcc/linker_script.ld
    - modules/nsx-core/src/apollo3p/gcc/linker_script.ld
    - modules/nsx-core/src/sbrk.c
    - modules/nsx-core/includes-api/nsx_system.h
    - tests/test_cmake_contract.py
