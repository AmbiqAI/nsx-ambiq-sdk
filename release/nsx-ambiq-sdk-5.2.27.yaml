  raw_source_committed: false
  official_numbered_release_claimed: false
  identity_scope: The identity above is what the artifact manifest and the provider module record. Of
    the shipped payload, only the atomiq110 atfe and acfe archives are recorded as built from it. Every
    other archive and every non-atomiq110 header is stable-2026.06.18 (caaf5af8) content, the atomiq110
    headers are the npu-drop-2026.07.09 payload, and the atomiq110 gcc archive's source is not recorded.
    See payload_provenance and known deviations mixed-snapshot-provider-payload and atomiq110-header-archive-mismatch.
payload_provenance:
  summary: '5.2.26 ships the 5.2.25 binary payload unchanged: every HAL/BSP archive and the artifact manifest
    are byte-identical to v5.2.25. The provider headers differ from v5.2.25 only by intake patches 001
    and 002 (clang C++ compatibility), which are recorded as the clang-cxx-header-compat exception and
    known deviation. Applying both patches to the v5.2.25 modules/nsx-ambiqsuite/sdk tree with "git apply
    --directory=modules/nsx-ambiqsuite/sdk" yields the 5.2.26 tree byte-for-byte (checked during 5.2.26
    preparation).'
  binary_payload_identical_to: 5.2.26
  carried_over_source_commit: caaf5af86087881647f56c70646c748d40c86e23
  carried_over_archives_note: 'Only the six atomiq110 archives were rebuilt after 5.2.24: the atfe and
    acfe ones from 3062036c4f (commit 2138331), and the gcc ones in d5a1a93 from a source that commit
    does not record. Every other part/board archive (67) is byte-identical to the 5.2.23 payload, whose
    object code was built from caaf5af86087881647f56c70646c748d40c86e23; those archives were not rebuilt
    against 3062036c4f. Per-train, per-set provenance is in toolchain_trains[].archive_sets.'
  artifact_manifest_generated_at: 2026-06-22
  archive_determinism:
    gcc: non_deterministic_ar_headers
    atfe: deterministic
    acfe: deterministic
  determinism_note: gcc archives are produced by arm-none-eabi-ar in non-deterministic mode, so their
    bytes change on every rebuild even when no object code changes. atfe (llvm-ar) and acfe (armar) archives
    carry zeroed member timestamps, so their bytes change only when object code changes. Comparing archive
    bytes across commits therefore means different things per train; see docs/acfe-artifact-manifest-forensics.md.
  toolchain_trains:
  - manifest_key: gcc
    cmake_family: gcc
    archive_sets:
    - scope: non_atomiq110
      archive_count: 23
      built_from_source_commit: caaf5af86087881647f56c70646c748d40c86e23
    - scope: atomiq110
      archive_count: 2
      built_from_source_commit: null
      source_note: 'Refreshed in d5a1a9321fd4f970a56d98d35b9786b31e32fbf0, whose message does not name
        the AmbiqSuite source. The archive predates AmbiqSuite 1d9cd5c06e (2026-07-22, an ancestor of
        both 78bb76821e and 3062036c4f): it does not define the memory-vote API (am_hal_pwrctrl_mem_vote_request/_release/_status_get,
        am_hal_pwrctrl_mem_retention_status_get) or the am_hal_secure_stimer_*/am_hal_secure_timer_* functions
        that the atfe/acfe archives define. So it was not built from 3062036c4f, although the artifact-manifest
        comment on this archive says it was. See known deviation atomiq110-header-archive-mismatch.'
    archives_introduced_in:
    - 1a919aee0f24adb17fa6345fc15a874d1e3a4c29
    - 74682fbe6a1a3933ff1d81ed3f2be5e2ce165d29
    - ed60f26f4bdaa885d6a279a20a6e94aa23cd3655
    - 960624ee18afd9fbf5db957371c92c828bf6a721
    - d5a1a9321fd4f970a56d98d35b9786b31e32fbf0
    manifest_hashes_correct_in_5_2_23: true
  - manifest_key: atfe
    cmake_family: atfe
    archive_sets:
    - scope: non_atomiq110
      archive_count: 23
      built_from_source_commit: caaf5af86087881647f56c70646c748d40c86e23
      source_note: Object-code equivalent to a caaf5af8 build; most of these archives are byte-identical
        since 56a72f08 (see byte_stability_note).
    - scope: atomiq110
      archive_count: 2
      built_from_source_commit: 3062036c4f3e7822d27e6a842f226f423328a25a
      source_note: 'Rebuilt in 213833166a13f3abb9ae5b0d2de72530155a42ff with ATfE 22.1.0, which records
        3062036c4f as the source. Consistent with the symbols: the archive defines the memory-vote API
        added upstream in 1d9cd5c06e, an ancestor of 3062036c4f. Not independently re-derived from source.'
    archives_introduced_in:
    - 56a72f08b34e9315f8c58a9defb784329e789678
    - 74682fbe6a1a3933ff1d81ed3f2be5e2ce165d29
    - ed60f26f4bdaa885d6a279a20a6e94aa23cd3655
    - 960624ee18afd9fbf5db957371c92c828bf6a721
    - 213833166a13f3abb9ae5b0d2de72530155a42ff
    byte_stability_note: '22 of these 25 archives have been byte-identical since 56a72f08b34e9315f8c58a9defb784329e789678,
      which predates the caaf5af86087881647f56c70646c748d40c86e23 regeneration in 1a919aee0f24adb17fa6345fc15a874d1e3a4c29.
      That is expected rather than stale: llvm-ar is deterministic, and the corresponding gcc archives
      rebuilt in 1a919aee differ only in ar member timestamps, with every object member byte-identical,
      so the upstream delta changed no object code.'
    manifest_hashes_correct_in_5_2_23: true
  - manifest_key: acfe
    cmake_family: armclang
    archive_sets:
    - scope: non_atomiq110
      archive_count: 21
      built_from_source_commit: caaf5af86087881647f56c70646c748d40c86e23
    - scope: atomiq110
      archive_count: 2
      built_from_source_commit: 3062036c4f3e7822d27e6a842f226f423328a25a
      source_note: Rebuilt in 213833166a13f3abb9ae5b0d2de72530155a42ff with ACfE 6.24 (-fshort-wchar -fshort-enums),
        which records 3062036c4f as the source. Defines the same global symbols as the atfe archive. Not
        independently re-derived from source.
    abi_cflags: -fshort-wchar -fshort-enums
    abi_attributes:
      Tag_ABI_PCS_wchar_t: 2
      Tag_ABI_enum_size: smallest_container
    archives_introduced_in:
    - ddb88640e61660edc65ebc956b65dcbd6804d2e6
    - ed60f26f4bdaa885d6a279a20a6e94aa23cd3655
    - 960624ee18afd9fbf5db957371c92c828bf6a721
    - 213833166a13f3abb9ae5b0d2de72530155a42ff
    byte_stability_note: All 55 object members of a sampled acfe HAL archive differ across ddb88640e61660edc65ebc956b65dcbd6804d2e6,
      and armar emits zeroed member timestamps, so that commit is a genuine object-code rebuild rather
      than archive-metadata churn.
    manifest_hashes_correct_in_5_2_23: false
    correction: 22 acfe sha256 records in the artifact manifest still described the pre-ABI-fix archives
      replaced by ddb88640e61660edc65ebc956b65dcbd6804d2e6. 5.2.24 records the sha256 of the archives
