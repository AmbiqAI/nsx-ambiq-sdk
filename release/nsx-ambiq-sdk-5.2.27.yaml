known_deviations:
- id: clang-cxx-header-compat
  description: 'The provider headers under modules/nsx-ambiqsuite/sdk diverge from the recorded AmbiqSuite
    payload by intake patches 001 (clang-cxx-compiler-detection) and 002 (clang-cxx-unnamed-bitfield-qualifiers):
    26 files, 40 lines (23 headers and 3 C sources, devices/am_devices_mspi_psram_*.c), applied directly
    to the committed payload because it cannot be re-staged from a single AmbiqSuite commit (issue #82).
    No prebuilt archive is affected, and no NSX module compiles the three patched .c files. Every configuration
    that compiled before selects the same branch (C with gcc or clang, C++ with gcc, armclang), and register
    struct layout is unchanged. No archive or artifact-manifest change, so no artifact hash changes. Fixes
    issue #81. The scoped ownership exception is clang-cxx-header-compat on the generated-ambiqsuite-provider
    entry in release/source-ownership.yaml; tests/test_committed_intake_patches.py fails if a regenerated
    payload drops either patch.'
  upstream_status: Upstream resolution is tracked by AmbiqAI/nsx-ambiq-sdk#82; its current PR status was
    not revalidated during this release preparation. Retire the patches only after regenerated payload
    validation.
  issues:
  - 81
  - 82
  paths:
  - release/source-ownership.yaml
