upstream:
  provider: ambiqsuite
  source_kind: git_ref
  source_ref: 6a2a0c08af553e33716f2e251cb74aa370e2ae0f
  source_commit: 6a2a0c08af553e33716f2e251cb74aa370e2ae0f
