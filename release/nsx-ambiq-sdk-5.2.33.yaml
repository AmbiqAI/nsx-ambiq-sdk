      are promoted. NSX bounded _sbrk force-link protection remains required.
    schema_version: 1
    upstream_commit: 3cfb7d50718e6fb016f1a0128121cb40598109d5
  staging_patches:
  - path: sdk-intake/patches/stable/001-clang-cxx-compiler-detection.patch
    metadata: sdk-intake/patches/stable/001-clang-cxx-compiler-detection.yaml
    sha256: aaff31ed1ea548f3a2e933e4ec250028cc22925b94ac2f68be142fa077340d13
    owner: apage224
    reason: 'AmbiqSuite selects its GNU code path with defined(__GNUC_STDC_INLINE__), which describes inline
      semantics rather than the compiler. gcc defines it in C and C++, but clang defines it only for C (C++
      gets __GNUC_GNU_INLINE__), so any C++ translation unit built with ATfE clang++ that includes am_hal_global.h,
      atomiq110 am_reg_macros.h, apollo2 am_reg_macros_asm.h, or the MSPI PSRAM device headers falls through
      to "#error Compiler is unknown". The patch tests defined(__GNUC__) instead; armclang is still matched
      first by __ARMCC_VERSION. It also adds the space missing in the AM_DEVICE_RPMB_DEBUG string paste ("..."fmt),
      which C++11 lexes as a user-defined literal suffix and clang rejects. Every configuration that compiled
      before (C99 and later with gcc or clang, C++ with gcc, armclang) selects the same branch as before, so
      the prebuilt HAL/BSP archives are unaffected; older modes (C89/gnu89, C++98) that used to hit the #error
      now take the GNU path. Fixes AmbiqAI/nsx-ambiq-sdk#81. Retire once the fix lands upstream in AmbiqSuite
      (tracked in AmbiqAI/nsx-ambiq-sdk#82).

      '
  - path: sdk-intake/patches/stable/002-clang-cxx-unnamed-bitfield-qualifiers.patch
    metadata: sdk-intake/patches/stable/002-clang-cxx-unnamed-bitfield-qualifiers.yaml
    sha256: e73ae0c0f61ade5f827ba030c6b0fa49e38fd143a203372d45011d498f3338b5
    owner: apage224
    reason: 'The USB register headers for apollo4p, apollo510, apollo510L and apollo330P declare unnamed padding
      bit-fields as `__IM uint32_t : N;`. __IM expands to `volatile const`, and C++ does not allow qualifiers
      on an unnamed bit-field, so clang++ rejects any C++ translation unit that includes these headers ("anonymous
      bit-field cannot have qualifiers"); g++ accepts it. An unnamed bit-field cannot be accessed, so dropping
      the qualifier changes neither layout nor behavior (sizeof of every register struct is unchanged with
      arm-none-eabi-gcc). Companion to patch 001 for AmbiqAI/nsx-ambiq-sdk#81. Retire once the fix lands upstream
      in AmbiqSuite (tracked in AmbiqAI/nsx-ambiq-sdk#82).

      '
  - path: sdk-intake/patches/stable/003-cxx17-cc312-register.patch
    metadata: sdk-intake/patches/stable/003-cxx17-cc312-register.yaml
    sha256: c0fe8f8b8b3a7f191feea5354f039ae8da79479c6d5892f57fbe8254f358f337
    owner: apage224
    reason: 'The stable-2026.11.05 CC312 busy-wait inline helper declares its timeout with the plain register
      storage class, which ATfE and ArmClang reject in C++17. Remove only that optional hint; preserve the
      timeout and volatile MMIO loop. No fixed-register assembly binding is involved. Retire when upstream
      headers compile in C++17 without this correction.

      '
  - path: sdk-intake/patches/stable/004-em9305-tx-receive-scratch.patch
    metadata: sdk-intake/patches/stable/004-em9305-tx-receive-scratch.yaml
    sha256: 82ad0a78233e5931455c84bdadbd1d3b1be6ae97d0885031d4af7037c5f27920
    owner: apage224
    reason: 'The EM9305 blocking writer supplies only 16 bytes of receive scratch to full-duplex transfers
      that can contain up to 255 bytes per controller credit. Size that scratch to the existing maximum transport
      packet, preserving word alignment, packet limits and SPI transaction behavior. This consumer-compiled
      device source is not part of the prebuilt HAL/BSP archives. Retire when upstream sizes the receive scratch
      for every accepted transfer. Local tracking: AmbiqAI/nsx-ambiq-sdk#195; no upstream submission has been
      made.

      '
