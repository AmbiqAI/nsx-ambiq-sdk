known_deviations:
  - id: clang-cxx-header-compat
    description: >-
      The provider headers under modules/nsx-ambiqsuite/sdk diverge from the
      recorded AmbiqSuite payload by intake patches 001
      (clang-cxx-compiler-detection) and 002
      (clang-cxx-unnamed-bitfield-qualifiers): 26 files, 40 lines (23 headers
      and 3 C sources, devices/am_devices_mspi_psram_*.c), applied directly to
      the committed payload because it cannot be re-staged from a single
      AmbiqSuite commit (issue #82). No prebuilt archive is affected, and no
      NSX module compiles the three patched .c files. Every configuration
      that compiled before selects the same branch (C with gcc or clang, C++
      with gcc, armclang), and register struct layout is unchanged. No
      archive or artifact-manifest change, so no artifact hash changes.
      Fixes issue #81. The scoped ownership exception is clang-cxx-header-compat
      on the generated-ambiqsuite-provider entry in release/source-ownership.yaml;
      tests/test_committed_intake_patches.py fails if a regenerated payload
      drops either patch.
    upstream_status: >-
      Fix in progress upstream on AmbiqSuite branch
      bugfix/clang-cxx-header-compat (48bd9bd576, on stable b5375f2ab9); the
      AmbiqSuite pull request is not yet open. Tracked by
      AmbiqAI/nsx-ambiq-sdk#82. Retire both patches and this deviation once a
      regenerated payload carries the fix.
    issues: [81, 82]
    paths:
      - release/source-ownership.yaml
      - sdk-intake/patches/stable/001-clang-cxx-compiler-detection.patch
      - sdk-intake/patches/stable/001-clang-cxx-compiler-detection.yaml
      - sdk-intake/patches/stable/002-clang-cxx-unnamed-bitfield-qualifiers.patch
      - sdk-intake/patches/stable/002-clang-cxx-unnamed-bitfield-qualifiers.yaml
      - tests/test_committed_intake_patches.py
  - id: mixed-snapshot-provider-payload
    description: >-
      The provider identity records stable-2026.09.01 / 3062036c4f, but the
      shipped payload comes from four sources, unchanged since 5.2.25:
      (1) non-atomiq110 headers and all 67 non-atomiq110 archives are
      stable-2026.06.18 / caaf5af86087881647f56c70646c748d40c86e23 content,
      plus the clang C++ intake patches; (2) the atomiq110 headers
      (mcu/atomiq110, boards/atomiq110_fpga_turbo, system_atomiq110.{h,c})
      are the npu-drop-2026.07.09 payload, INTERNAL-marker sanitized, and
      every one carries the "revision npu-drop-2026.07.09" banner; after
      removing INTERNAL blocks and banner lines, 28 of the 64 files that also
      exist at 3062036c4f still differ in content from it; (3) the atomiq110
      atfe and acfe archives are recorded as built from 3062036c4f; (4) the
      atomiq110 gcc archives were refreshed from a source that is not
      recorded and that predates 3062036c4f. The artifact-manifest comments
      that say all three atomiq110 trains were rebuilt from 3062036c4f are
      wrong for gcc; the manifest is generated payload and is left as shipped.
      The payload therefore cannot be reproduced from one AmbiqSuite commit.
      Resolution is tracked in issue #82.
    issues: [82]
    paths:
      - modules/nsx-ambiqsuite/sdk/artifact-manifest.yaml
      - modules/nsx-ambiqsuite/nsx-module.yaml
      - modules/nsx-ambiqsuite/sdk/mcu/atomiq110
  - id: atomiq110-header-archive-mismatch
    status: open
    description: >-
      atomiq110 (experimental) ships headers and prebuilt HAL archives built
      from different sources (see mixed-snapshot-provider-payload), and they
      do not match. Of the 544 am_hal_* function prototypes in the shipped
      mcu/atomiq110 headers, 19 are defined by none of the three shipped
      atomiq110 libam_hal.a archives: am_hal_systick_delay_us,
      am_hal_mcuctrl_clkncnt_get, am_hal_mcuctrl_finecnt_get,
      am_hal_mcuctrl_i3c_phy_pulldown_enable,
      am_hal_mcuctrl_private_extclk32k_{enable,disable},
      am_hal_mcuctrl_rss_codebase_set, am_hal_pdm_i2s_{enable,disable},
      am_hal_pwrctrl_rss_{bootup,pwroff},
      am_hal_pwrctrl_tempco_{init,sample_handler}, am_hal_spotmgr_log_change,
      am_hal_spotmgr_simobuck_lp_autosw_{init,enable,disable},
      am_hal_spotmgr_tempco_suspend and am_hal_sysctrl_ton_config_init. A
      call to any of them compiles and then fails to link. Conversely, all
      three archives define functions no shipped header declares, among them
      am_hal_wdt_* (13 functions; am_hal_wdt.h is not shipped),
      am_hal_ddb_*, am_hal_dsi_*, am_hal_pwrctrl_gpu_mode_select,
      am_hal_rtc_osc_get and am_hal_usb_ep_xfer_abort (128 in the gcc
      archive, 168 in atfe/acfe). The gcc archive also lacks 40 functions
      the atfe/acfe archives define (the memory-vote API and
      am_hal_secure_stimer_*/am_hal_secure_timer_*), so the same app can link
      differently per toolchain. Enum and register-macro values also differ
      between the two header sets (for example am_reg.h, am_hal_timer.h,
      am_hal_pwrctrl.h, am_hal_gpio.h), so values an app passes into the
      archives may be interpreted against different definitions. Counts from
      llvm-nm --defined-only over the shipped archives and a prototype scan
      of the shipped headers during 5.2.26 preparation. Not a regression for
      atomiq110 consumers moving from 5.2.25 (identical bytes), and atomiq110
      stays experimental and outside the qualified scope. Fixing it needs a
      consistent atomiq110 regeneration (headers and all three archive
      trains from one AmbiqSuite commit) in a later release.
    paths:
      - modules/nsx-ambiqsuite/sdk/mcu/atomiq110
      - modules/nsx-ambiqsuite/sdk/lib/gcc/atomiq110
      - modules/nsx-ambiqsuite/sdk/lib/atfe/atomiq110
      - modules/nsx-ambiqsuite/sdk/lib/acfe/atomiq110
  - id: nsx-cordio-vendored-revision-label
    status: corrected_in_5_2_26
    description: >-
      In 5.2.25 (tag v5.2.25, aefce2ca) nsx-cordio's vendored-revision label
      (NSX_VENDORED_VERSION.txt and both `revision:` lines of the `vendored:`
      block in nsx-module.yaml) read stable-2026.09.01 (3062036c4f), set in
      0940bca/2138331, but the cordio and uecc sources were never re-vendored.
      Checked read-only against AmbiqSuite during 5.2.26 preparation: all 452
      vendored files match caaf5af860 except 7 NSX-edited files that predate
      v5.2.24 (PR #30: dm_api.h, dm_sec_lesc.c, sec_ecc.c, smp_sc_act.c,
      svc_core.c/.h, svc_dis.c), and the 9 upstream cordio files that changed
      between caaf5af860 and 3062036c4f are not carried (em9305 and 510L radio
      HCI drivers and the em9305 firmware image, smp_act.c, hci_defs.h,
      fit_main.c). 5.2.26 corrects the label to stable-2026.06.18 (caaf5af860)
      and lists the NSX edits in NSX_VENDORED_VERSION.txt and the module
      README; the sources are unchanged. The released 5.2.25 record is left
      as published. Moving cordio to newer upstream is a BLE stack change for
      a separate, tested release.
    paths:
      - modules/nsx-cordio/sdk/third_party/NSX_VENDORED_VERSION.txt
      - modules/nsx-cordio/nsx-module.yaml
      - modules/nsx-cordio/README.md
  - id: atomiq110-internal-marker-sanitation
    description: >-
      The atomiq110 headers under modules/nsx-ambiqsuite/sdk/mcu/atomiq110
      diverge from the raw npu-drop-2026.07.09 payload by a one-time,
      deletion-only sanitation (sdk-intake/internal_markers.py): 988 lines of
      vendor INTERNAL-fenced dead content removed across 23 files, zero lines
      added or modified, nothing visible to the compiler changed, no artifact
      hash changes. Tool-reproducible; the scoped ownership exception is
      recorded on the generated-ambiqsuite-provider entry in
      release/source-ownership.yaml. See issue #52. Carried from 5.2.25.
    issues: [52]
    paths:
      - release/source-ownership.yaml
      - sdk-intake/internal_markers.py
      - modules/nsx-ambiqsuite/sdk/mcu/atomiq110
  - id: nsx-ethos-u-driver-external
    description: >-
      nsx-npu requires nsx-ethos-u-driver, which is deliberately not part of
