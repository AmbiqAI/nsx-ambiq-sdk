known_deviations:
  - id: ble-dis-firmware-revision-default
    paths:
      - modules/nsx-ble/src/ns_ble.c
      - modules/nsx-cordio/sdk/third_party/cordio/ble-profiles/sources/services/svc_dis.c
    description: >-
      The BLE Device Information Service default firmware-revision string still
      reads 5.2.23. It is an overridable runtime default rather than release or
      provenance metadata, one of the two copies lives in third-party Cordio
      source declared direct_edit restricted, and docs/versioning.md scopes the
      distribution version to the root package and the manifests under modules/.
      Deliberately left unchanged so this provenance correction does not edit
      third-party BLE source; tracked as follow-up work.

