      - apollo3
      - apollo3p
      - apollo4l
      - apollo4p
      - apollo330P
      - apollo510
      - apollo510b
      - apollo510L
    boards:
      - apollo2_evb
      - apollo3_evb
      - apollo3_evb_cygnus
      - apollo3p_evb
      - apollo3p_evb_cygnus
      - apollo4l_evb
      - apollo4l_blue_evb
      - apollo4p_evb
      - apollo4p_blue_kbr_evb
      - apollo4p_blue_kxr_evb
      - apollo4p_evb_disp_shield_rev2
      - apollo330mP_evb
      - apollo510_evb
      - apollo510b_evb
      - apollo510dL_evb
  toolchains:
    - cmake_family: gcc
      artifact_manifest_key: gcc
      artifact_status: built
      representative_link_smoke: passed
    - cmake_family: atfe
      artifact_manifest_key: atfe
      artifact_status: built
      representative_link_smoke: passed
    - cmake_family: armclang
      artifact_manifest_key: acfe
      artifact_status: built
      representative_link_smoke: passed
  hardware_status: limited_feature_evidence_only

exclusions:
  descriptor_only:
    socs:
      - apollo5b
    boards:
      - apollo5b_evb
  experimental:
    socs:
      - atomiq110
    boards:
      - atomiq110_fpga_turbo
    experimental_note: >-
      atomiq110 is FPGA bring-up on atomiq110_fpga_turbo and stays outside
      qualified archive scope for 5.2.25. Its descriptors, promoted archives,
      and the nsx-npu module are present and buildable, and parts of the
      platform have been exercised on the FPGA, but no silicon exists, the FPGA
      clock tree is not yet characterised, and no link-smoke or artifact
      qualification claim is made for it. It leaves experimental status no
      earlier than silicon qualification.

known_deviations:
  - id: atomiq110-payload-identity
    description: >-
      The atomiq110 HAL/BSP archives were regenerated from the
      npu-drop-2026.07.09 payload rather than from the stable-2026.06.18 /
      caaf5af86087881647f56c70646c748d40c86e23 snapshot that `upstream:` and the
      artifact manifest's `sdk:` block declare for this distribution. The
      distribution therefore carries two upstream payload identities. Every
      qualified SoC and board is on the declared snapshot; only experimental
      atomiq110 is on the npu drop, and the divergence is recorded per artifact
      in the artifact manifest rather than left to be inferred.
    introduced_in: 960624ee18afd9fbf5db957371c92c828bf6a721
    paths:
      - modules/nsx-ambiqsuite/sdk/artifact-manifest.yaml
      - modules/nsx-ambiqsuite/sdk/lib/gcc/atomiq110
      - modules/nsx-ambiqsuite/sdk/lib/atfe/atomiq110
      - modules/nsx-ambiqsuite/sdk/lib/acfe/atomiq110
  - id: atomiq110-internal-marker-sanitation
    description: >-
      The atomiq110 headers on this branch diverge from the npu-drop-2026.07.09
      payload by a one-time, deletion-only sanitation of vendor
      `#### INTERNAL ####` engineering content: 988 lines removed across 23
      files, zero lines added or modified. npu-drop-2026.07.09 is a raw
      engineering drop that upstream's release tooling had not stripped. The
      scrub is tool-reproducible (sdk-intake/internal_markers.py), removed only
      marker lines, marker-block bodies with no live preprocessor tokens,
      `#if 0 ... #endif` regions inside a fence, and blank lines at a deletion
      seam, and kept verbatim any block still holding a live declaration. No
      symbol visible to the compiler that built the prebuilt archives changed
      and no artifact hash changed. modules/nsx-ambiqsuite/sdk is
      `direct_edit: forbidden`, so this is recorded as a scoped, reviewed
      ownership exception; future payloads are sanitized while staged, gated by
      assert_no_new_internal_markers against the committed baseline.
    issue: 52
    introduced_in: 835d80b01d58c14f264ee18d7e74a219c0731ef8
    files_changed: 23
    lines_removed: 988
    lines_added: 0
    artifact_hashes_changed: false
    ownership_exception: atomiq110-internal-marker-sanitation
    paths:
      - release/source-ownership.yaml
      - sdk-intake/internal_markers.py
      - sdk-intake/internal-marker-baseline.yaml
      - modules/nsx-ambiqsuite/sdk/mcu/atomiq110

